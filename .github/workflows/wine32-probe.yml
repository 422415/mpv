name: Wine32 full verification
on:
  push:
    branches: [ci/ajn-wine32-probe]
jobs:
  mingw:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      WINEPREFIX: /tmp/wine
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      DOWNLOAD_CACHE: ${{ github.workspace }}/.ccache/downloads
      TARGET: ${{ matrix.arch }}-w64-mingw32
      RUST_TARGET: ${{ matrix.arch }}-pc-windows-gnu
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i686
            # 32-bit Wine's socket calls fail inside the hosted container.
            # Keep its execution tests on the VM with the LTS package set.
            runner: ubuntu-26.04
            container: ''
            wine: wine32
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          install_cmd=()
          if [ "$(id -u)" -ne 0 ]; then install_cmd=(sudo); fi
          "${install_cmd[@]}" dpkg --add-architecture i386
          "${install_cmd[@]}" apt-get update
          "${install_cmd[@]}" apt-get install --no-install-recommends -y ca-certificates ccache cmake g++-mingw-w64 gcc-multilib git make meson nasm ninja-build pkgconf rustup wget xz-utils ${{ matrix.wine }} wine
          rustup default stable
          rustup target add ${{ env.RUST_TARGET }}
          # Wine requires an existing prefix to belong to its current user.
          mkdir -p "$WINEPREFIX"
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: actions/checkout@v7

      - name: Get time
        id: get_time
        run: echo "timestamp=`date +%s%N`" >> $GITHUB_OUTPUT

      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: ${{ env.TARGET }}-

      - name: Install Meson Wraps
        run: |
          mkdir subprojects -p
          meson wrap install mujs
          meson subprojects download

      - name: Verify standard format checking before the full build
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/printf-check.c" <<'EOF'
          #include <stdio.h>
          void check(size_t n) {
          #ifdef BAD_FORMAT
              fprintf(stderr, "%zu\n", (char *)0);
          #else
              fprintf(stderr, "%zu\n", n);
          #endif
          }
          EOF
          flags=(-std=c11 -U__STRICT_ANSI__ -O2 -Wall -Werror=format
                 -D_FORTIFY_SOURCE=3 -D__USE_MINGW_ANSI_STDIO=1 -fno-builtin-fprintf)
          i686-w64-mingw32-gcc-posix "${flags[@]}" -fsyntax-only "$RUNNER_TEMP/printf-check.c"
          if i686-w64-mingw32-gcc-posix "${flags[@]}" -DBAD_FORMAT -fsyntax-only "$RUNNER_TEMP/printf-check.c" >"$RUNNER_TEMP/invalid-format.log" 2>&1; then
              echo "Invalid format argument was not rejected"
              exit 1
          fi
          echo "C99 format accepted; invalid argument rejected."

      - name: Build libraries
        run: |
          ./ci/build-mingw64.sh

      - name: Build with meson
        id: build
        run: |
          ./ci/build-mingw64.sh meson pack

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          cat ./mingw_build/meson-logs/meson-log.txt

      - name: Functional test
        run: |
          cd artifact && wine ./mpv.com -v --no-config
        env:
          WINEDEBUG: '+loaddll'

      - name: Run meson tests
        id: tests
        run: |
          # Dynamically loaded libmpv tests do not inherit Meson's DLL search paths.
          export WINEPATH="$(winepath -w "$PWD/artifact")"
          meson test -C mingw_build

      - name: Print meson test log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: |
          cat ./mingw_build/meson-logs/testlog.txt

      - name: Artifact name
        id: artifact
        run: |
          VERSION_FILE=$(find . -path "*/common/version.h" -type f | head -n 1)
          VER=$(grep VERSION "$VERSION_FILE" | cut -d'"' -f2)
          PR=${{ github.event.pull_request.number && format('-pr{0}', github.event.pull_request.number) || '' }}
          echo "name=mpv-$VER$PR-${{ github.run_id }}-$TARGET" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifact/*

      - name: Save Cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
